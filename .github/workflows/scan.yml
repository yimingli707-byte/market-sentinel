name: Market scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

# Prevent overlapping scheduled/manual runs from racing to update the same files.
concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scanner.py

      - name: Save latest scan and alert state
        run: |
          git config user.name "market-sentinel-bot"
          git config user.email "actions@users.noreply.github.com"

          git add signals.json signal_state.json

          if git diff --cached --quiet; then
            echo "No scan state changes to commit."
            exit 0
          fi

          git commit -m "Update market scan"

          # Rebase onto the latest main to avoid a non-fast-forward push.
          git pull --rebase origin main
          git push origin HEAD:main
