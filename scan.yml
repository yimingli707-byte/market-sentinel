name: Market scan
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: market-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scanner.py
      - name: Save latest scan and alert state
        run: |
          git config user.name "market-sentinel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals.json signal_state.json
          git diff --cached --quiet || git commit -m "Update market scan"
          git push
